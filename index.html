<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00f2fe;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }
        h1 { 
            font-size: 24px; 
            margin-bottom: 5px; 
            font-weight: 600;
        }
        p { 
            color: #ccc; 
            font-size: 14px; 
            margin-bottom: 25px; 
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            background: #00f2fe;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #4facfe;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 1. यहाँ 'my-photo.jpg' की जगह अपनी फोटो का नाम लिखें -->
        <img src="my-photo.jpg" alt="Profile" class="profile-img">
        
        <!-- 2. यहाँ अपना नाम और प्रोफाइल बायो बदलें -->
        <h1>आपका नाम</h1>
        <p>Developer | Creator | Tech Enthusiast</p>

        <!-- 3. यहाँ अपने सोशल मीडिया लिंक्स डालें -->
        <a href="https://github.com/kalhydar5" target="_blank" class="btn">🚀 My GitHub Profile</a>
        <a href="https://instagram.com" target="_blank" class="btn">📸 Instagram</a>
        <a href="#" class="btn">💬 Contact Me</a>
    </div>

</body>
</html>
